name: Pages

# Builds the GitHub Pages site: a landing page presenting the project, the
# interactive reports of `make bench-compare` and `make bench-compare-lib`
# and the API documentation (site/build.sh).
#
# Two modes:
#
# * full, for a version tag (`make release VERSION=X.Y.Z` pushes vX.Y.Z;
#   semver pre-releases too) or a manual run (Actions > Pages > Run
#   workflow): measures both benchmarks on this runner, refreshes the
#   benchmark section of README.md (charts, summary, detailed results) and
#   commits it to master (site/publish-results.sh), then deploys;
# * site, for a push to master that changes the site (paths below): reuses
#   the reports of the latest release from the deployed site, rebuilds the
#   page and the API docs and deploys, in a few minutes.
#
# Full mode skips the benchmarks when the source code they measure has not
# changed: their reports are cached per source fingerprint (library,
# benchmark crates and runners, lockfile, Makefile, chart scripts, plus the
# compiler version and the settings below). A run whose fingerprint is
# cached skips the benchmarks, the charts and the README commit and deploys
# the cached reports; only complete reports are cached. Ticking "Measure
# the benchmarks" in a manual run measures anyway; bump BENCH_CACHE_VERSION
# when a benchmark command of this file changes. Compiled dependencies are
# cached too (Swatinem/rust-cache).
#
# The github-pages environment allows master and v* tags.

on:
  push:
    branches: [master]
    # Path filters only apply to branch pushes; tag pushes always run.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "docs/images/logo.png"
      - "docs/videos/**"
      - "benchmarks/charts/lookup-flamegraph.svg"
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Measure the benchmarks even if the source code is unchanged
        type: boolean
        default: false

permissions:
  contents: read

# One queue per mode: a newer release supersedes a running release build
# (the benchmarks take about an hour), a site change never cancels it.
concurrency:
  group: pages-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'site' || 'full' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COMPARE_SIZES: "1k,10k,100k,1M"
  LIB_PROFILE: standard
  BENCH_CACHE_VERSION: "1"
  MODE: ${{ github.event_name == 'push' && github.ref_type == 'branch' && 'site' || 'full' }}

jobs:
  build:
    name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && 'site and docs (latest release reports)' || 'benchmarks, docs and site' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write # commits the refreshed README and charts to master
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages
      - id: pages
        uses: actions/configure-pages@v5

      # Full mode: measure only when no complete report of the same sources
      # is cached (steps.plan.outputs.measure stays empty in site mode).
      - id: fingerprint
        name: Source fingerprint of the benchmarks
        if: env.MODE == 'full'
        env:
          SOURCES: ${{ hashFiles('src/**', 'derive/**', 'benches/support/**', 'benchmarks/compare/**', 'benchmarks/compare-lib/**', 'Cargo.toml', 'Cargo.lock', 'Makefile', 'site/charts.*', 'site/pack_png.py', 'site/readme_blocks.py') }}
        run: |
          rustc=$(rustc --version | cut -d' ' -f2)
          echo "key=bench-reports-v$BENCH_CACHE_VERSION-rustc$rustc-${COMPARE_SIZES//,/_}-$LIB_PROFILE-$SOURCES" >> "$GITHUB_OUTPUT"
      - id: cached
        if: env.MODE == 'full'
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/reports
          key: ${{ steps.fingerprint.outputs.key }}
      - id: plan
        name: Measure or reuse the reports
        if: env.MODE == 'full'
        env:
          HIT: ${{ steps.cached.outputs.cache-hit }}
          FORCE: ${{ inputs.benchmarks }}
        run: |
          if [[ $HIT == true && $FORCE != true ]]; then
            echo "measure=false" >> "$GITHUB_OUTPUT"
            echo "::notice::benchmarks skipped: the source code is unchanged since the cached reports"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

      # Any go >= 1.21: bench-compare-lib fetches the toolchain pinned in go.mod.
      - uses: actions/setup-go@v5
        if: steps.plan.outputs.measure == 'true'
        with:
          go-version: "1.24"
          cache: false
      # The chart captures drive the runner's Chrome over the DevTools
      # protocol (global WebSocket: Node 22+) and finish with Pillow.
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.measure == 'true'
        with:
          node-version: "22"
      - name: Chart tools
        if: steps.plan.outputs.measure == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          google-chrome --version

      - name: Runner
        if: steps.plan.outputs.measure == 'true'
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-200
          free -h
          cargo run --quiet --release --features batch-simd --example batch_kernel

      # Thread counts follow the runner's CPUs; MEM_LIMIT_MIB=auto skips the
      # sizes that would not fit in its memory. Failed or invalid runs are
      # reported in the page instead of blocking it.
      - name: make bench-compare
        if: steps.plan.outputs.measure == 'true'
        run: |
          threads="1,2,$(nproc)"
          make bench-compare SIZES="$COMPARE_SIZES" THREADS="$threads" MEM_LIMIT_MIB=auto BUDGET=3600 README=1 \
            || echo "::warning::bench-compare reported failed or invalid runs (see its report)"

      - name: make bench-compare-lib
        if: steps.plan.outputs.measure == 'true'
        run: |
          make bench-compare-lib BENCH_PROFILE="$LIB_PROFILE" BENCH_THREADS="1,2,$(nproc)" BENCH_README=1 \
            || echo "::warning::bench-compare-lib did not complete (see its report)"

      - id: complete
        name: Complete reports
        if: steps.plan.outputs.measure == 'true'
        run: |
          ok=true
          jq -e '.meta.complete == true and ([.runs[] | select(.status == "failed" or .status == "invalid")] | length) == 0' \
            benchmarks/reports/results.json > /dev/null || ok=false
          jq -e '.meta.status == "complete"' benchmarks/reports/bench-compare-lib.json > /dev/null || ok=false
          echo "complete=$ok" >> "$GITHUB_OUTPUT"
          [[ $ok == true ]] || echo "::warning::incomplete benchmark reports: not cached, the next run measures again"
      - name: Cache the benchmark reports
        if: steps.plan.outputs.measure == 'true' && steps.cached.outputs.cache-hit != 'true' && steps.complete.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/reports
          key: ${{ steps.fingerprint.outputs.key }}

      # README.md now holds the new summary and detailed results (README=1,
      # BENCH_README=1); the charts are captured from the new reports.
      - name: Benchmark charts
        if: steps.plan.outputs.measure == 'true'
        run: site/charts.sh

      - name: Commit the benchmark results to master
        if: steps.plan.outputs.measure == 'true'
        run: site/publish-results.sh

      # Site mode: the reports of the latest release, as deployed.
      - name: Reports of the latest release
        if: env.MODE == 'site'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p benchmarks/reports
          for f in bench-compare/report.html bench-compare/results.json bench-compare/results.csv \
                   bench-compare-lib/bench-compare-lib.html bench-compare-lib/bench-compare-lib.json \
                   bench-compare-lib/bench-compare-lib.csv; do
            curl -fsSL "$BASE_URL/$f" -o "benchmarks/reports/${f#*/}" \
              || echo "::warning::$f is not on the deployed site: its card will say no report"
          done

      - name: API documentation
        run: cargo doc -p dir-24-8 --all-features --no-deps

      - name: Assemble the site
        env:
          REPORTS_REUSED: ${{ env.MODE == 'site' && '1' || '' }}
          REPORTS_CACHED: ${{ steps.plan.outputs.measure == 'false' && '1' || '' }}
        run: site/build.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
